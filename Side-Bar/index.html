<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side-Bar test</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div id="head"><marquee scrollamount="10" behavior="alternate" direction="right" class="marquee-text">Side Bar test</marquee></div>
    </header>

    <div id="container">
        <div id="side-bar">
            <div id="side-bar-icon"><img src="icons/3917762.png"></div>
            <div class="side-blocks">
                <img src="icons/home.png">
                <p class="side-text">Home</p>
            </div>
            <div class="side-blocks">
                <img src="icons/search.png">
                <p class="side-text">Search</p>
            </div>
            <div class="side-blocks">
                <img src="icons/add.png">
                <p class="side-text">Post</p>
            </div>
            <div class="side-blocks">
                <img src="icons/bookmark.png">
                <p class="side-text">Bookmarks</p>
            </div>
            <div class="side-blocks">
                <img src="icons/envelope.png">
                <p class="side-text">Email</p>
            </div>
            <div class="side-blocks">
                <img src="icons/marker.png">
                <p class="side-text">Location</p>
            </div>
        </div>
        <div id="main">
            <div class="main-container">
                <div class="main-blocks"></div>
                <div class="main-blocks"></div>
            </div>
        </div>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
